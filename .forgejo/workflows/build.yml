name: Build Desktop Client

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: docker
    container:
      image: node:26-bookworm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential python3 pkg-config libpipewire-0.3-dev

      - name: Setup pnpm
        run: |
          npm install --global pnpm@11.17.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Format
        run: pnpm run fmt

      - name: Build
        run: pnpm run package