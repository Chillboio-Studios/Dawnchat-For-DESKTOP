name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish a GitHub release
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint and format
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26.2.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Check formatting
        run: pnpm run fmt

  package:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image || fromJSON('null') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: Linux
            runner: ubuntu-latest
            image: ""
          - target: Windows
            runner: windows-latest
            image: ""
          - target: macOS
            runner: macos-latest
            image: ""
          - target: Flatpak
            runner: ubuntu-latest
            image: ""
          - target: AppImage
            runner: ubuntu-latest
            image: ghcr.io/pkgforge-dev/archlinux:v2026.05.15
    steps:
      - name: Prepare AppImage container
        if: matrix.target == 'AppImage'
        uses: pkgforge-dev/anylinux-setup-action@0964f2258d6c93d1391359978dde081fd8b3c6af # v2

      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install AppImage build tools
        if: matrix.target == 'AppImage'
        run: pacman -Syu --noconfirm base-devel python nodejs npm pipewire

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.publish_release && '24' || '26.2.0' }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Package desktop app
        if: ${{ matrix.target == 'AppImage' || (matrix.target != 'Flatpak' && !inputs.publish_release) }}
        run: pnpm run package

      - name: Install Flatpak tooling and runtimes
        if: ${{ matrix.target == 'Flatpak' || (inputs.publish_release && matrix.target == 'Linux') }}
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.freedesktop.Platform//25.08 org.freedesktop.Sdk//25.08
          flatpak install --user -y flathub org.electronjs.Electron2.BaseApp//stable

      - name: Make release packages
        if: ${{ inputs.publish_release && matrix.target != 'AppImage' && matrix.target != 'Flatpak' }}
        run: pnpm run make

      # --- macOS: Build signed .pkg and upload to App Store Connect ---
      # --- macOS: Build, sign, and upload macOS package to App Store Connect ---
      - name: Build, sign, and upload macOS package to App Store Connect
        if: ${{ inputs.publish_release && matrix.target == 'macOS' }}
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          MACOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.MACOS_PROVISIONING_PROFILE_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          # 1. Create temporary keychain and import certificates
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain-db
          KEYCHAIN_PASSWORD=$(uuidgen)
          CERT_FILE=$RUNNER_TEMP/cert.p12

          echo "$MACOS_CERTIFICATE_BASE64" | base64 --decode > "$CERT_FILE"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_FILE" -P "$MACOS_CERTIFICATE_PWD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

          # 2. Locate the packaged .app bundle
          APP_PATH=$(find out -type d -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "::error::Could not find .app bundle in 'out/'"
            exit 1
          fi
          echo "Found app bundle at: $APP_PATH"

          # 3. Find signing identities
          APP_IDENTITY=$(security find-identity -v "$KEYCHAIN_PATH" | grep -o '"Apple Distribution: [^"]*"' | head -n 1 | tr -d '"')
          INSTALLER_IDENTITY=$(security find-identity -v "$KEYCHAIN_PATH" | grep -o '"3rd Party Mac Developer Installer: [^"]*"' | head -n 1 | tr -d '"')

          if [ -z "$APP_IDENTITY" ] || [ -z "$INSTALLER_IDENTITY" ]; then
            echo "::error::Missing required signing identities. Need both Apple Distribution and 3rd Party Mac Developer Installer."
            security find-identity -v "$KEYCHAIN_PATH"
            exit 1
          fi

          echo "App Signing Identity: $APP_IDENTITY"
          echo "Installer Signing Identity: $INSTALLER_IDENTITY"

          # 4. Install the provisioning profile into the app bundle
          echo "$MACOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$APP_PATH/Contents/embedded.provisionprofile"

          # 5. Deep-sign all child components and frameworks with child.plist (Sandboxed)
          echo "Signing helper applications, libraries, and frameworks..."
          find "$APP_PATH/Contents/Frameworks" -name "*.dylib" -o -name "*.framework" | while read -r item; do
            codesign --force --verify --verbose --sign "$APP_IDENTITY" \
              --keychain "$KEYCHAIN_PATH" \
              --entitlements entitlements/child.plist \
              --options runtime "$item" || true
          done

          find "$APP_PATH/Contents/Frameworks" -name "*.app" | while read -r helper; do
            codesign --force --verify --verbose --sign "$APP_IDENTITY" \
              --keychain "$KEYCHAIN_PATH" \
              --entitlements entitlements/child.plist \
              --options runtime "$helper"
          done

          # 6. Sign the main .app bundle with parent.plist
          echo "Signing main application bundle..."
          codesign --force --verify --verbose --sign "$APP_IDENTITY" \
            --keychain "$KEYCHAIN_PATH" \
            --entitlements entitlements/parent.plist \
            --options runtime "$APP_PATH"

          # 7. Package and sign the .pkg using productbuild
          mkdir -p out/make
          PKG_PATH="out/make/DawnChat.pkg"

          productbuild \
            --component "$APP_PATH" /Applications \
            --sign "$INSTALLER_IDENTITY" \
            --keychain "$KEYCHAIN_PATH" \
            "$PKG_PATH"

          # 8. Setup App Store Connect API Key (.p8)
          mkdir -p ~/.appstoreconnect/private_keys
          KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8"

          if echo "$APPLE_API_PRIVATE_KEY" | grep -q "BEGIN PRIVATE KEY"; then
            echo "$APPLE_API_PRIVATE_KEY" > "$KEY_PATH"
          else
            echo "$APPLE_API_PRIVATE_KEY" | base64 --decode > "$KEY_PATH"
          fi
          trap 'rm -f "$KEY_PATH"; security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true' EXIT

          # 9. Validate and upload package to App Store Connect
          echo "Validating package..."
          xcrun altool --validate-app \
            -f "$PKG_PATH" \
            -t macos \
            --apiKey "$APPLE_API_KEY_ID" \
            --apiIssuer "$APPLE_API_ISSUER_ID"

          echo "Uploading package to App Store Connect..."
          xcrun altool --upload-app \
            -f "$PKG_PATH" \
            -t macos \
            --apiKey "$APPLE_API_KEY_ID" \
            --apiIssuer "$APPLE_API_ISSUER_ID"

      - name: Build Flatpak
        if: matrix.target == 'Flatpak'
        run: pnpm run make

      - name: Archive Linux package for AppImage
        if: matrix.target == 'AppImage'
        run: mkdir -p /tmp/dawnchat && tar -czf /tmp/dawnchat/DawnChat.tar.gz -C out/DawnChat-linux-x64 .

      - name: Install AppImage runtime dependencies
        if: matrix.target == 'AppImage'
        run: /bin/sh ./.github/build/appimage/get-dependencies.sh

      - name: Read AppImage version
        if: matrix.target == 'AppImage'
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Prepare AppDir
        if: matrix.target == 'AppImage'
        run: /bin/sh ./.github/build/appimage/extract-artifact.sh
        env:
          BUILD_ARCH: x64
          BUILD_VERSION: ${{ inputs.publish_release && steps.version.outputs.value || 'nightly' }}

      - name: Build and test AppImage
        if: matrix.target == 'AppImage'
        run: /bin/sh ./.github/build/appimage/make-appimage.sh

      - name: Upload packaged app artifact
        if: matrix.target != 'AppImage' && matrix.target != 'Flatpak'
        uses: actions/upload-artifact@v6
        with:
          name: DawnChat-${{ matrix.target }}
          path: out

      - name: Upload AppImage artifact
        if: matrix.target == 'AppImage'
        uses: actions/upload-artifact@v6
        with:
          name: DawnChat-${{ matrix.target }}
          path: |
            out
            dist

      - name: Upload Flatpak artifact
        if: matrix.target == 'Flatpak'
        uses: actions/upload-artifact@v6
        with:
          name: DawnChat-${{ matrix.target }}
          path: out/make/flatpak/**/*.flatpak
          if-no-files-found: error

  release:
    name: Create release from all build artifacts
    if: ${{ inputs.publish_release }}
    needs: [quality, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Download all build artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: DawnChat-*
          path: artifacts

      - name: Collect individual release files
        run: |
          mkdir -p release-assets
          for artifact in artifacts/DawnChat-*; do
            target=${artifact##*/}
            if [ "$target" = "DawnChat-AppImage" ]; then
              source_dir="$artifact/dist"
            elif [ "$target" = "DawnChat-Flatpak" ]; then
              source_dir="$artifact"
            else
              source_dir="$artifact/make"
            fi

            if [ ! -d "$source_dir" ]; then
              echo "Missing release output: $source_dir" >&2
              exit 1
            fi

            while IFS= read -r -d '' file; do
              if [ "$target" = "DawnChat-Linux" ] && [[ "$file" == *.flatpak ]]; then
                continue
              fi
              asset_name=${file##*/}
              if [ -e "release-assets/$asset_name" ]; then
                echo "Duplicate release filename: $asset_name" >&2
                exit 1
              fi
              cp "$file" "release-assets/$asset_name"
            done < <(find "$source_dir" -type f -print0)
          done

          if [ -z "$(find release-assets -type f -print -quit)" ]; then
            echo "No release files were collected" >&2
            exit 1
          fi

      - name: Create GitHub release
        run: |
          version=$(node -p "require('./package.json').version")
          tag="v${version}"
          gh release create "$tag" \
            --target "$GITHUB_SHA" \
            --title "$tag" \
            --generate-notes \
            release-assets/*
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
