name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish a GitHub release
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint and format
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26.2.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Check formatting
        run: pnpm run fmt

  package:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image || fromJSON('null') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: Linux
            runner: ubuntu-latest
            image: ""
          - target: Windows
            runner: windows-latest
            image: ""
          - target: macOS
            runner: macos-latest
            image: ""
          - target: AppImage
            runner: ubuntu-latest
            image: ghcr.io/pkgforge-dev/archlinux:v2026.05.15
    permissions:
      contents: write

    steps:
      - name: Prepare AppImage container
        if: matrix.target == 'AppImage'
        uses: pkgforge-dev/anylinux-setup-action@0964f2258d6c93d1391359978dde081fd8b3c6af # v2

      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install AppImage build tools
        if: matrix.target == 'AppImage'
        run: pacman -Syu --noconfirm base-devel python nodejs npm pipewire

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.publish_release && '24' || '26.2.0' }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Package desktop app
        if: ${{ !inputs.publish_release || matrix.target == 'AppImage' }}
        run: pnpm run package

      - name: Install Flatpak tooling and runtimes
        if: ${{ inputs.publish_release && matrix.target == 'Linux' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.freedesktop.Platform//25.08 org.freedesktop.Sdk//25.08
          flatpak install --user -y flathub org.electronjs.Electron2.BaseApp//stable

      - name: Publish GitHub release
        if: ${{ inputs.publish_release && matrix.target != 'AppImage' }}
        run: pnpm run publish
        env:
          PLATFORM: ${{ matrix.runner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Archive Linux package for AppImage
        if: matrix.target == 'AppImage'
        run: mkdir -p /tmp/dawnchat && tar -czf /tmp/dawnchat/DawnChat.tar.gz -C out/DawnChat-linux-x64 .

      - name: Install AppImage runtime dependencies
        if: matrix.target == 'AppImage'
        run: /bin/sh ./.github/build/appimage/get-dependencies.sh

      - name: Read AppImage version
        if: matrix.target == 'AppImage'
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Prepare AppDir
        if: matrix.target == 'AppImage'
        run: /bin/sh ./.github/build/appimage/extract-artifact.sh
        env:
          BUILD_ARCH: x64
          BUILD_VERSION: ${{ inputs.publish_release && steps.version.outputs.value || 'nightly' }}

      - name: Build and test AppImage
        if: matrix.target == 'AppImage'
        run: /bin/sh ./.github/build/appimage/make-appimage.sh

      - name: Upload AppImage
        if: matrix.target == 'AppImage'
        uses: actions/upload-artifact@v6
        with:
          name: AppImage-x64
          path: dist

  publish-appimage:
    name: Add AppImage to release
    if: ${{ inputs.publish_release }}
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Download AppImage
        uses: actions/download-artifact@v7
        with:
          name: AppImage-x64
          path: dist

      - name: Upload AppImage to GitHub release
        run: |
          version=$(node -p "require('./package.json').version")
          gh release upload "v${version}" dist/*.AppImage* --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
